name: Refresh long-video thumbnails

on:
  push:
    branches: [main]
    paths: ["pipeline/thumbnail.py", ".github/workflows/thumbnails.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thumbnails
  cancel-in-progress: true

jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install Python packages
        run: pip install -r pipeline/requirements.txt
      - name: Redraw every long-video thumbnail
        run: |
          for f in longform/*.json; do python pipeline/thumbnail.py "$f" || true; done
          git config user.name "render-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/thumb-*.jpg
          git commit -q -m "Refresh long-video thumbnails (vivid colour style)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep 10; done

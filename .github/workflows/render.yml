name: Render episodes

on:
  push:
    branches: [main]
    paths: ["episodes/**", "pipeline/**", ".github/workflows/render.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-int8

      - name: Download free voice model (Kokoro)
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s models/kokoro-v1.0.int8.onnx ] || curl -sSL -o models/kokoro-v1.0.int8.onnx $base/kokoro-v1.0.int8.onnx
          [ -s models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin $base/voices-v1.0.bin

      - name: Install Python packages
        run: pip install -r pipeline/requirements.txt

      - name: Render new or changed episodes
        run: python pipeline/render.py --all

      - name: Save videos to the repo
        run: |
          git config user.name "render-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos previews
          if git diff --cached --quiet; then echo "No new videos."; exit 0; fi
          git commit -m "Render episodes"
          git pull --rebase origin main
          git push
